<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snOS</title>
  </head>
  <body
    style="
      margin: 0;
      height: 100vh;
      background-image: url(&quot;./wallpaper.png&quot;);
      background-size: cover;
      background-position: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    "
  >
    <div
      style="
        position: absolute;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px);
        color: white;
        box-sizing: border-box;
        padding: 6px 18px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        z-index: 1000;
      "
    >
      <p
        style="
          font-weight: bold;
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        snOS
      </p>

      <p
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        ⚡ SN OS ⚡
      </p>

      <p
        id="timeElement"
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      ></p>
    </div>

    <div
      style="
        position: absolute;
        top: 60px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 10;
      "
    >
      <div
        id="welcomeAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          🤖
        </div>
        <span>About snOS</span>
      </div>

      <div
        id="notesAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          📝
        </div>
        <span>Notes</span>
      </div>
    </div>

    <div
      id="myWindow"
      class="window"
      style="
        position: absolute;
        top: 50%;
        left: 55%;
        transform: translate(-50%, -50%);
        width: 320px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        z-index: 20;
      "
    >
      <div
        id="windowHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >snOS</span
        >
        <button
          id="closeBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          ✕
        </button>
      </div>

      <div style="padding: 24px; text-align: center">
        <img
          src="https://api.dicebear.com/7.x/bottts/svg?seed=SNOS"
          alt="Avatar"
          style="
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            margin-bottom: 12px;
          "
        />
        <h2 style="margin: 0 0 8px 0; color: #38bdf8">snOS</h2>
        <p style="margin: 0 0 16px 0; color: #cbd5e1; font-size: 14px">
          Personal Web Operating System
        </p>
      </div>
    </div>

    <div
      id="notesWindow"
      class="window"
      style="
        position: absolute;
        top: 45%;
        left: 35%;
        transform: translate(-50%, -50%);
        width: 340px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        display: none;
        z-index: 30;
      "
    >
      <div
        id="notesHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >Notes App</span
        >
        <button
          id="closeNotesBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          ✕
        </button>
      </div>

      <div style="padding: 16px">
        <textarea
          id="noteInput"
          placeholder="Type your notes here..."
          style="
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            outline: none;
          "
        ></textarea>
      </div>
    </div>

    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentTime;
      }
      setInterval(updateTime, 1000);

      let highestZIndex = 30;
      function bringToFront(windowElem) {
        highestZIndex++;
        windowElem.style.zIndex = highestZIndex;
      }

      document.querySelectorAll(".window").forEach((win) => {
        win.addEventListener("mousedown", () => bringToFront(win));
      });

      const closeBtn = document.getElementById("closeBtn");
      const myWindow = document.getElementById("myWindow");
      const welcomeAppIcon = document.getElementById("welcomeAppIcon");

      closeBtn.addEventListener("click", () => {
        myWindow.style.display = "none";
      });

      welcomeAppIcon.addEventListener("click", () => {
        myWindow.style.display = "block";
        bringToFront(myWindow);
      });

      const closeNotesBtn = document.getElementById("closeNotesBtn");
      const notesWindow = document.getElementById("notesWindow");
      const notesAppIcon = document.getElementById("notesAppIcon");
      const noteInput = document.getElementById("noteInput");

      if (localStorage.getItem("snOS_notes")) {
        noteInput.value = localStorage.getItem("snOS_notes");
      }

      noteInput.addEventListener("input", () => {
        localStorage.setItem("snOS_notes", noteInput.value);
      });

      closeNotesBtn.addEventListener("click", () => {
        notesWindow.style.display = "none";
      });

      notesAppIcon.addEventListener("click", () => {
        notesWindow.style.display = "block";
        bringToFront(notesWindow);
      });

      function makeDraggable(windowElem, headerElem) {
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        headerElem.addEventListener("mousedown", (e) => {
          isDragging = true;
          bringToFront(windowElem);
          const rect = windowElem.getBoundingClientRect();
          windowElem.style.transform = "none";
          windowElem.style.left = rect.left + "px";
          windowElem.style.top = rect.top + "px";
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
        });

        document.addEventListener("mousemove", (e) => {
          if (isDragging) {
            windowElem.style.left = e.clientX - offsetX + "px";
            windowElem.style.top = e.clientY - offsetY + "px";
          }
        });

        document.addEventListener("mouseup", () => {
          isDragging = false;
        });
      }

      makeDraggable(myWindow, document.getElementById("windowHeader"));
      makeDraggable(notesWindow, document.getElementById("notesHeader"));
    </script>
  </body>
</html>
