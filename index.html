<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>snOS - welcome Screen</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #2c5364);
      color: white;
      font-family: &quot;Segoe UI&quot;, Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    "
  >
    <img
      src="https://api.dicebear.com/7.x/bottts/svg?seed=SNOS"
      alt="snOS Avatar"
      style="
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgb(255, 255, 0.4);
        margin-bottom: 16px;
      "
    />

    <h1
      style="
        font-size: 52px;
        letter-spacing: 8px;
        margin: 4px 0;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      "
    >
      s n O S
    </h1>

    <h2
      style="
        font-size: 20px;
        font-weight: 300;
        margin: 0 0 20px 0;
        color: #a8c0ff;
      "
    >
      Personal Web Operating System
    </h2>

    <p
      style="
        max-width: 450px;
        line-height: 1.6;
        font-size: 16px;
        margin-bottom: 24px;
        background: rgba(255, 255, 255, 0.08);
        padding: 16px;
        border-radius: 12px;
      "
    >
      Welcome to my OS! I am building <strong>SNOS</strong> for the Hack Club
      Jam.<br />
      <s>Boring static websites</s> ➔ <strong>Interactive Web OS!</strong><br />
      <abbr title="Personal Operating System">POS</abbr>
    </p>

    <a
      href="https://github.com/mshibin04"
      target="_blank"
      style="
        color: #72c6ef;
        text-decoration: none;
        font-size: 14px;
        margin-bottom: 24px;
      "
    >
      🔗 Check out my GitHub
    </a>

    <button
      id="enter-btn"
      style="
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        color: #0f2027;
        background-color: #ffffff;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      "
    >
      Boot Up snOS ➔
    </button>
  </body>
</html>
