<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snOS - WebOS</title>
  </head>

  <body
    style="
      margin: 0;
      height: 100vh;
      background-image: url(&quot;./wallpaper.png&quot;);
      background-size: cover;
      background-position: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    "
  >
    <div
      style="
        position: absolute;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px);
        color: white;
        box-sizing: border-box;
        padding: 6px 18px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      "
    >
      <p
        style="
          font-weight: bold;
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        snOS
      </p>

      <p
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        ⚡ snOS ⚡
      </p>

      <p
        id="timeElement"
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        Loading...
      </p>
    </div>

    <div
      style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        padding: 24px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        color: #ffffff;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      "
    >
      <img
        src="https://api.dicebear.com/7.x/bottts/svg?seed=SNOS"
        alt="Avatar"
        style="
          width: 80px;
          height: 80px;
          border-radius: 50%;
          border: 2px solid #38bdf8;
          margin-bottom: 12px;
        "
      />
      <h2 style="margin: 0 0 8px 0; color: #38bdf8">Welcome to snOS</h2>
      <p style="margin: 0 0 16px 0; color: #cbd5e1; font-size: 14px">
        Personal Web Operating System
      </p>
      <button
        style="
          background-color: #38bdf8;
          color: #0f172a;
          border: none;
          padding: 8px 18px;
          font-weight: bold;
          border-radius: 8px;
          cursor: pointer;
        "
      >
        Booting Up...
      </button>
    </div>

    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentTime;
      }

      // Update clock every second
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
