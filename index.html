<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snOS</title>
  </head>
  <body
    style="
      margin: 0;
      height: 100vh;
      background-image: url(&quot;./wallpaper.png&quot;);
      background-size: cover;
      background-position: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    "
  >
    <!-- Top Navigation Bar -->
    <div
      style="
        position: absolute;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(12px);
        color: white;
        box-sizing: border-box;
        padding: 6px 18px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        z-index: 1000;
      "
    >
      <p
        style="
          font-weight: bold;
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        snOS
      </p>

      <p
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      >
        ⚡ SN OS ⚡
      </p>

      <p
        id="timeElement"
        style="
          background-color: rgba(255, 255, 255, 0.1);
          padding: 4px 12px;
          border-radius: 12px;
          margin: 0;
        "
      ></p>
    </div>

    <!-- Desktop Icons -->
    <div
      style="
        position: absolute;
        top: 60px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 10;
      "
    >
      <div
        id="welcomeAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          🤖
        </div>
        <span>About snOS</span>
      </div>

      <div
        id="notesAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          📝
        </div>
        <span>Notes</span>
      </div>

      <div
        id="weatherAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          🌤️
        </div>
        <span>Weather</span>
      </div>

      <!-- NEW UNIQUE FEATURE: Browser App Icon -->
      <div
        id="browserAppIcon"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          cursor: pointer;
          width: 70px;
          color: white;
          font-size: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
          "
        >
          🌐
        </div>
        <span>Web Browser</span>
      </div>
    </div>

    <!-- Window 1: About snOS -->
    <div
      id="myWindow"
      class="window"
      style="
        position: absolute;
        top: 50%;
        left: 60%;
        transform: translate(-50%, -50%);
        width: 300px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        z-index: 20;
      "
    >
      <div
        id="windowHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >snOS</span
        >
        <button
          id="closeBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          ✕
        </button>
      </div>
      <div style="padding: 24px; text-align: center">
        <img
          src="https://api.dicebear.com/7.x/bottts/svg?seed=SNOS"
          alt="Avatar"
          style="
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            margin-bottom: 12px;
          "
        />
        <h2 style="margin: 0 0 8px 0; color: #38bdf8">snOS</h2>
        <p style="margin: 0; color: #cbd5e1; font-size: 13px">
          Personal Web Operating System
        </p>
      </div>
    </div>

    <!-- Window 2: Notes App -->
    <div
      id="notesWindow"
      class="window"
      style="
        position: absolute;
        top: 40%;
        left: 30%;
        transform: translate(-50%, -50%);
        width: 320px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        display: none;
        z-index: 30;
      "
    >
      <div
        id="notesHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >Notes App Pro</span
        >
        <button
          id="closeNotesBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          ✕
        </button>
      </div>
      <div style="padding: 16px">
        <textarea
          id="noteInput"
          placeholder="Write your notes... (Auto-saved)"
          style="
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
          "
        ></textarea>
      </div>
    </div>

    <!-- Window 3: Weather App -->
    <div
      id="weatherWindow"
      class="window"
      style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 340px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        display: none;
        z-index: 40;
      "
    >
      <div
        id="weatherHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >Weather Forecast</span
        >
        <button
          id="closeWeatherBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          ✕
        </button>
      </div>

      <div style="padding: 18px">
        <div style="display: flex; gap: 8px; margin-bottom: 16px">
          <input
            id="citySearch"
            type="text"
            placeholder="Enter city name..."
            style="
              flex: 1;
              background: rgba(0, 0, 0, 0.4);
              border: 1px solid rgba(56, 189, 248, 0.3);
              border-radius: 8px;
              color: white;
              padding: 8px;
              outline: none;
              font-size: 13px;
            "
          />
          <button
            id="searchBtn"
            style="
              background: #38bdf8;
              border: none;
              border-radius: 8px;
              color: #0f172a;
              font-weight: bold;
              padding: 0 12px;
              cursor: pointer;
              font-size: 12px;
            "
          >
            Search
          </button>
        </div>

        <div
          style="
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.2);
          "
        >
          <div id="weatherIcon" style="font-size: 42px; margin-bottom: 4px">
            🌤️
          </div>
          <h3 id="cityName" style="margin: 0; color: #38bdf8; font-size: 20px">
            London
          </h3>
          <h1
            id="tempDisplay"
            style="margin: 6px 0; font-size: 38px; color: white"
          >
            --°C
          </h1>
          <p
            id="weatherCondition"
            style="margin: 0; color: #cbd5e1; font-size: 13px"
          >
            Search a location
          </p>

          <div
            style="
              display: flex;
              justify-content: space-around;
              margin-top: 16px;
              border-top: 1px solid rgba(255, 255, 255, 0.1);
              padding-top: 12px;
            "
          >
            <div>
              <span style="font-size: 11px; color: #94a3b8">Humidity</span>
              <p
                id="humidityVal"
                style="margin: 2px 0 0 0; font-weight: bold; color: #38bdf8"
              >
                --%
              </p>
            </div>
            <div>
              <span style="font-size: 11px; color: #94a3b8">Wind</span>
              <p
                id="windVal"
                style="margin: 2px 0 0 0; font-weight: bold; color: #38bdf8"
              >
                -- km/h
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Window 4: NEW Web Browser App (Custom Feature) -->
    <div
      id="browserWindow"
      class="window"
      style="
        position: absolute;
        top: 45%;
        left: 55%;
        transform: translate(-50%, -50%);
        width: 480px;
        height: 320px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        border-radius: 16px;
        background-color: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(16px);
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        display: none;
        z-index: 50;
      "
    >
      <div
        id="browserHeader"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          background-color: rgba(56, 189, 248, 0.15);
          padding: 8px 16px;
          cursor: move;
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <span style="font-size: 13px; font-weight: bold; color: #38bdf8"
          >snOS Browser</span
        >
        <button
          id="closeBrowserBtn"
          style="
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
          "
        >
          ✕
        </button>
      </div>

      <div
        style="
          display: flex;
          gap: 8px;
          padding: 8px 12px;
          background: rgba(0, 0, 0, 0.3);
          border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        "
      >
        <input
          id="browserUrl"
          type="text"
          value="https://wikipedia.org"
          style="
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            outline: none;
          "
        />
        <button
          id="goBtn"
          style="
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            padding: 0 10px;
            cursor: pointer;
            font-size: 12px;
          "
        >
          Go
        </button>
      </div>

      <iframe
        id="browserFrame"
        src="https://wikipedia.org"
        style="
          width: 100%;
          height: calc(100% - 75px);
          border: none;
          background: white;
        "
      ></iframe>
    </div>

    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        document.querySelector("#timeElement").innerHTML = currentTime;
      }
      setInterval(updateTime, 1000);
      updateTime();

      let highestZIndex = 50;
      function bringToFront(windowElem) {
        highestZIndex++;
        windowElem.style.zIndex = highestZIndex;
      }

      document.querySelectorAll(".window").forEach((win) => {
        win.addEventListener("mousedown", () => bringToFront(win));
      });

      // About Window
      const myWindow = document.getElementById("myWindow");
      document
        .getElementById("closeBtn")
        .addEventListener("click", () => (myWindow.style.display = "none"));
      document
        .getElementById("welcomeAppIcon")
        .addEventListener("click", () => {
          myWindow.style.display = "block";
          bringToFront(myWindow);
        });

      // Notes Window
      const notesWindow = document.getElementById("notesWindow");
      const noteInput = document.getElementById("noteInput");
      if (localStorage.getItem("snOS_notes")) {
        noteInput.value = localStorage.getItem("snOS_notes");
      }
      noteInput.addEventListener("input", () => {
        localStorage.setItem("snOS_notes", noteInput.value);
      });
      document
        .getElementById("closeNotesBtn")
        .addEventListener("click", () => (notesWindow.style.display = "none"));
      document.getElementById("notesAppIcon").addEventListener("click", () => {
        notesWindow.style.display = "block";
        bringToFront(notesWindow);
      });

      // Weather Window
      const weatherWindow = document.getElementById("weatherWindow");
      document
        .getElementById("closeWeatherBtn")
        .addEventListener(
          "click",
          () => (weatherWindow.style.display = "none"),
        );
      document
        .getElementById("weatherAppIcon")
        .addEventListener("click", () => {
          weatherWindow.style.display = "block";
          bringToFront(weatherWindow);
        });

      // Browser Window (Custom Feature)
      const browserWindow = document.getElementById("browserWindow");
      document
        .getElementById("closeBrowserBtn")
        .addEventListener(
          "click",
          () => (browserWindow.style.display = "none"),
        );
      document
        .getElementById("browserAppIcon")
        .addEventListener("click", () => {
          browserWindow.style.display = "block";
          bringToFront(browserWindow);
        });

      const browserUrl = document.getElementById("browserUrl");
      const browserFrame = document.getElementById("browserFrame");
      function loadUrl() {
        let url = browserUrl.value.trim();
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }
        browserFrame.src = url;
      }
      document.getElementById("goBtn").addEventListener("click", loadUrl);
      browserUrl.addEventListener("keypress", (e) => {
        if (e.key === "Enter") loadUrl();
      });

      // Weather API Fetcher
      async function fetchWeather(city) {
        const cityNameElem = document.getElementById("cityName");
        const tempDisplayElem = document.getElementById("tempDisplay");
        const weatherConditionElem =
          document.getElementById("weatherCondition");
        const windValElem = document.getElementById("windVal");
        const humidityValElem = document.getElementById("humidityVal");
        const weatherIconElem = document.getElementById("weatherIcon");

        try {
          cityNameElem.innerText = "Searching...";
          const geoRes = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`,
          );
          const geoData = await geoRes.json();

          if (!geoData.results || geoData.results.length === 0) {
            alert("City not found!");
            cityNameElem.innerText = "Not Found";
            return;
          }

          const location = geoData.results[0];
          const weatherRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current_weather=true&hourly=relativehumidity_2m`,
          );
          const weatherData = await weatherRes.json();
          const current = weatherData.current_weather;

          cityNameElem.innerText =
            location.name + (location.country ? `, ${location.country}` : "");
          tempDisplayElem.innerText = Math.round(current.temperature) + "°C";
          windValElem.innerText = current.windspeed + " km/h";
          humidityValElem.innerText =
            weatherData.hourly && weatherData.hourly.relativehumidity_2m
              ? weatherData.hourly.relativehumidity_2m[0] + "%"
              : "N/A";

          const code = current.weathercode;
          if (code === 0) {
            weatherIconElem.innerText = "☀️";
            weatherConditionElem.innerText = "Clear Sky";
          } else if (code <= 3) {
            weatherIconElem.innerText = "⛅";
            weatherConditionElem.innerText = "Partly Cloudy";
          } else if (code <= 48) {
            weatherIconElem.innerText = "🌫️";
            weatherConditionElem.innerText = "Foggy";
          } else if (code <= 67) {
            weatherIconElem.innerText = "🌧️";
            weatherConditionElem.innerText = "Rainy";
          } else if (code <= 77) {
            weatherIconElem.innerText = "❄️";
            weatherConditionElem.innerText = "Snowy";
          } else {
            weatherIconElem.innerText = "☁️";
            weatherConditionElem.innerText = "Cloudy";
          }
        } catch (err) {
          alert("Failed to fetch weather.");
          cityNameElem.innerText = "Error";
        }
      }

      document.getElementById("searchBtn").addEventListener("click", () => {
        const city = document.getElementById("citySearch").value.trim();
        if (city) fetchWeather(city);
      });

      document
        .getElementById("citySearch")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            const city = document.getElementById("citySearch").value.trim();
            if (city) fetchWeather(city);
          }
        });

      // Window Dragging
      function makeDraggable(windowElem, headerElem) {
        let isDragging = false,
          offsetX = 0,
          offsetY = 0;
        headerElem.addEventListener("mousedown", (e) => {
          isDragging = true;
          bringToFront(windowElem);
          const rect = windowElem.getBoundingClientRect();
          windowElem.style.transform = "none";
          windowElem.style.left = rect.left + "px";
          windowElem.style.top = rect.top + "px";
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
        });
        document.addEventListener("mousemove", (e) => {
          if (isDragging) {
            windowElem.style.left = e.clientX - offsetX + "px";
            windowElem.style.top = e.clientY - offsetY + "px";
          }
        });
        document.addEventListener("mouseup", () => (isDragging = false));
      }

      makeDraggable(myWindow, document.getElementById("windowHeader"));
      makeDraggable(notesWindow, document.getElementById("notesHeader"));
      makeDraggable(weatherWindow, document.getElementById("weatherHeader"));
      makeDraggable(browserWindow, document.getElementById("browserHeader"));
    </script>
  </body>
</html>
